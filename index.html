    />
    <script>
      /* Restores the path that 404.html stashed in ?redirect= (GitHub Pages
         only; other hosts never hit this). Runs before React mounts. */
      (function () {
        var m = /[?&]redirect=([^&]+)/.exec(window.location.search);
        if (m) history.replaceState(null, "", decodeURIComponent(m[1]));
      })();
    </script>

    <div id="root"></div>

    <script>
      if (location.hostname === "dweepvartak.github.io") {
        var b = document.createElement("script");
        b.type = "module";
        b.src = "https://static.cloudflareinsights.com/beacon.min.js";
        b.setAttribute(
          "data-cf-beacon",
          '{"token": "5c552f01dbde4b25b59afa7b8cdea673"}'
        );
        document.body.appendChild(b);
      }
    </script>
